<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nightways</title>

    <!-- Your own stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet map stylesheet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
</head>

<body>

    <main>
        <header class="hero">
            <h1 class="wordmark">Nightways</h1>

            <p class="tagline">
                Where can you wake up tomorrow?
            </p>
        </header>

        <form
            id="search-form"
            class="search-panel"
            aria-label="Search overnight destinations"
        >
            <label for="origin">From</label>

            <input
                id="origin"
                type="text"
                value="Dresden"
                required
            >

            <label for="date">Date</label>

            <input
                id="date"
                type="date"
                required
            >

            <button
                id="search-button"
                type="submit"
            >
                Explore tonight
            </button>

            <p
                id="search-status"
                class="search-status"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                hidden
            ></p>
        </form>

        <div class="destination-controls">
            <div
                class="mode-filter"
                role="group"
                aria-label="Filter destinations by transport mode"
            >
                <button
                    class="mode-filter-button is-active"
                    type="button"
                    data-mode="ALL"
                    aria-pressed="true"
                >
                    All
                </button>

                <button
                    class="mode-filter-button"
                    type="button"
                    data-mode="TRAIN"
                    aria-pressed="false"
                >
                    Train
                </button>

                <button
                    class="mode-filter-button"
                    type="button"
                    data-mode="COACH"
                    aria-pressed="false"
                >
                    Bus
                </button>
            </div>

            <div class="sort-control">
                <label for="destination-sort">
                    Sort by
                </label>

                <select id="destination-sort">
                    <option value="EARLIEST_ARRIVAL">
                        Earliest arrival
                    </option>
                    <option value="LATEST_DEPARTURE">
                        Latest departure
                    </option>
                    <option value="LONGEST_JOURNEY">
                        Longest journey
                    </option>
                    <option value="NAME">
                        A–Z
                    </option>
                </select>
            </div>
        </div>

        <!-- Europe map -->
        <div id="map"></div>

        <section
            id="results"
            aria-busy="false"
        >
            <h2 id="results-heading">Overnight destinations</h2>

            <p id="destination-count"></p>

            <div id="destination-list"></div>
        </section>
    </main>

    <!-- Leaflet map JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Your own JavaScript -->
    <script src="app.js"></script>

</body>

</html>
